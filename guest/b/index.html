<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>What Do You Want to Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f4;--grid:#e4e4e7;--card:#fff;--ink:#111114;--body:#4a4a52;--mute:#8b8b93;--accent:#6b4dff;--soft:#efeaff;
  --disp:"Inter Tight",system-ui,sans-serif;--ui:Inter,system-ui,sans-serif;--sh:0 1px 2px rgba(17,17,20,.06),0 8px 24px rgba(17,17,20,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;padding-bottom:110px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
img{display:block;width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* hero with floating photos */
.hero{position:relative;padding:124px 0 36px;text-align:center}
.hero h1{position:relative;z-index:2;font-family:var(--disp);font-weight:800;letter-spacing:-.045em;line-height:.95;font-size:clamp(44px,12vw,112px)}
.hero p{position:relative;z-index:2;margin:18px auto 0;max-width:24em;font-size:17px;line-height:1.45;color:var(--body)}
.fl{position:absolute;background:var(--card);padding:6px;border-radius:12px;box-shadow:var(--sh);z-index:1}
.fl img{border-radius:7px;aspect-ratio:4/3;object-fit:cover}
.fl.v img{aspect-ratio:3/4}
.f1{width:118px;left:0;top:24px}.f2{width:76px;right:0;top:8px}
.f3,.f4,.f5,.f6{display:none}
@media (min-width:900px){
  .hero{padding:120px 0 150px}
  .f1{width:200px;left:0;top:40px}.f2{width:140px;right:40px;top:16px}
  .f3{display:block;width:180px;left:70px;bottom:24px}.f4{display:block;width:210px;right:0;bottom:40px}
  .f5{display:none}.f6{display:block;width:130px;right:270px;bottom:12px}
}

/* filter pills */
.pills{position:sticky;top:0;z-index:6;padding:10px 0;background:linear-gradient(var(--bg) 70%,rgba(243,243,244,0))}
.pills .in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
.pills .in::-webkit-scrollbar{display:none}
@media (min-width:900px){.pills .in{justify-content:center}}
.pill{background:var(--card);border:1px solid var(--grid);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:500;white-space:nowrap;min-height:40px}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* wall */
.wall{scroll-margin-top:64px;display:flex;gap:12px;padding-top:14px;align-items:flex-start}
.col{flex:1;min-width:0}
@media (min-width:700px){.wall{gap:20px}}
.pc{margin-bottom:12px;background:var(--card);border-radius:14px;padding:6px 6px 12px;box-shadow:var(--sh);position:relative;cursor:pointer}
.pc{margin-bottom:16px;padding:8px 8px 16px}
@media (min-width:700px){.pc{margin-bottom:20px}.pc h2{font-size:18px}.pc .d{font-size:14px}.pc .m{font-size:13px}}
.pc h2{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-.015em;margin:10px 4px 0}
.pc .m{font-size:14px;color:var(--mute);margin:4px 4px 0}
.pc .m b{color:var(--ink);font-weight:600}
.pc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.heart{transition:background .15s,transform .15s}.heart:active{transform:scale(.9)}
.heart{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2}
.heart[aria-pressed=true]{background:var(--accent)}
.heart[aria-pressed=true] svg{fill:#fff;stroke:#fff}

/* photo carousel */
.car{position:relative;border-radius:9px;overflow:hidden;background:#e9e9ec;aspect-ratio:4/3}
.car.tall{aspect-ratio:4/5}
@media (min-width:700px){.car.tall{aspect-ratio:3/4}}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;height:100%;object-fit:cover;scroll-snap-align:start}
.ar{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:opacity .15s}
.ar svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ar.l{left:6px}.ar.r{right:6px}
.ar[disabled]{opacity:0;pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));color:#fff;font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.cap span:last-child{opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .d{font-size:15px;line-height:1.45;color:var(--body);margin:6px 4px 0}
.sh .car{border-radius:0;aspect-ratio:4/3;max-height:58vh;width:100%}
.sh .cap{font-size:15px;padding:28px 16px 12px}

/* tray */
.tray{position:fixed;left:50%;bottom:16px;z-index:9;transform:translate(-50%,140%);transition:transform .25s;width:calc(100% - 32px);max-width:520px;
  background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(17,17,20,.2);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px}
.tray.on{transform:translate(-50%,0)}
.thumbs{display:flex;flex:1;min-width:0;overflow:hidden}
.thumbs img{width:40px;height:40px;object-fit:cover;border-radius:9px;border:2px solid #fff;margin-left:-10px;flex:none}
.thumbs img:first-child{margin-left:0}
.tray .n{font-size:15px;font-weight:600;white-space:nowrap}
.go{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;white-space:nowrap}

/* sheet */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;border-radius:20px 20px 0 0;background:var(--card);color:var(--ink)}
@media (min-width:700px){dialog{margin:auto;border-radius:20px}}
dialog::backdrop{background:rgba(17,17,20,.45)}
.sh .in{padding:18px 18px 22px}
.sh h3{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.05}
.sh p{margin-top:10px;font-size:17px;line-height:1.5;color:var(--body)}
.sh dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:14px;font-size:15px}
.sh dt{color:var(--mute)}
.sh .row{display:flex;gap:10px;margin-top:18px}
.sh .row button{flex:1;border-radius:12px;padding:13px;font-weight:600;font-size:15px;background:var(--bg)}
.sh .row .pri{background:var(--accent);color:#fff}
.sh ol{margin:12px 0 0 22px;font-size:17px;line-height:1.55}
footer{margin-top:48px;font-size:13px;line-height:1.5;color:var(--mute);background:var(--bg);padding:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="fl f1"><img src="../../img/x-ramen.jpg" alt=""></div>
    <div class="fl f2 v"><img src="../../img/c6.jpg" alt=""></div>
    <div class="fl f3"><img src="../../img/x-kzsushi.jpg" alt=""></div>
    <div class="fl f4"><img src="../../img/x-boat.jpg" alt=""></div>
    <div class="fl f5 v"><img src="../../img/x-sandal.jpg" alt=""></div>
    <div class="fl f6"><img src="../../img/x-coffee.jpg" alt=""></div>
    <h1>What do you<br>want to do?</h1>
    <p>Tap ♡ on anything you like. Then send me your picks and I will plan your free time.</p>
  </header>
</div>
<nav class="pills" aria-label="Filter"><div class="wrap"><div class="in" id="f"></div></div></nav>
<main class="wrap"><div class="wall" id="wall"></div><footer id="cr"></footer></main>

<div class="tray" id="tray"><div class="thumbs" id="th"></div><span class="n" id="n"></span><button class="go" id="go">Send picks</button></div>
<dialog id="dlg"><div class="sh" id="sh" data-k=""></div></dialog>

<script src="../../data/exp.js"></script>
<script src="../data-en.js"></script>
<script>
const X=window.EXP,EN=window.EN,$=id=>document.getElementById(id),picked=new Set();
const CATS=[["all","Everything"],["anime","Anime"],["food","Food"],["make","Make"],["walk","Walk"],["outdoor","Outdoor"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
$("f").innerHTML=CATS.map(([k,l])=>`<button class="pill" data-k="${k}" aria-pressed="${k=="all"}">${l}</button>`).join("");
const TALL=new Set(window.TALL||[]),GAL=window.GAL||{};
const ARR=d=>`<svg viewBox="0 0 24 24"><path d="${d?"M9 5l7 7-7 7":"M15 5l-7 7 7 7"}"/></svg>`;
const pics=k=>GAL[k]?GAL[k].map(([f,c])=>["../../img/g/"+f+".jpg",c]):[["../../img/"+X[k].img,""]];
function car(k,tall){const p=pics(k);
  return `<div class="car${tall?" tall":""}"><div class="track">${p.map(([s])=>`<img src="${s}" alt="">`).join("")}</div>
    ${p.length>1?`<button class="ar l" aria-label="Previous photo" disabled>${ARR(0)}</button><button class="ar r" aria-label="Next photo">${ARR(1)}</button>`:""}
    <div class="cap"><span>${esc(p[0][1])}</span>${p.length>1?`<span>1 / ${p.length}</span>`:""}</div></div>`}
function card(k){const e=EN[k],x=X[k],r=x.kind=="tour"&&x.rating?` · <b>★ ${x.rating}</b>`:"";
  return `<article class="pc" data-k="${k}" tabindex="0">${car(k,TALL.has(k))}
    <button class="heart" data-k="${k}" aria-label="Like" aria-pressed="${picked.has(k)}">${HEART}</button>
    <h2>${esc(e.t)}</h2><p class="m">${esc(e.area)} · ${esc(e.dur)}${r}</p><p class="d">${esc(e.d)}</p></article>`}
// carousel: arrows scroll one photo, counter + caption follow the scroll
document.addEventListener("click",ev=>{const a=ev.target.closest(".ar");if(!a)return;ev.stopPropagation();
  const t=a.parentNode.querySelector(".track");t.scrollBy({left:(a.classList.contains("r")?1:-1)*t.clientWidth,behavior:"smooth"})},true);
document.addEventListener("scroll",ev=>{const t=ev.target;if(!t.classList||!t.classList.contains("track"))return;
  const c=t.parentNode,k=c.closest("[data-k]").dataset.k,p=pics(k),i=Math.round(t.scrollLeft/t.clientWidth);
  c.querySelector(".ar.l").disabled=i==0;c.querySelector(".ar.r").disabled=i==p.length-1;
  c.querySelector(".cap").innerHTML=`<span>${esc(p[i][1])}</span><span>${i+1} / ${p.length}</span>`},true);
function render(cat){cur=cat;
  // ponytail: estimated heights (tall photo vs wide photo) instead of measuring; fine for 19 cards
  const n=innerWidth>=1100?4:innerWidth>=700?3:1,cols=Array.from({length:n},()=>({h:0,html:""}));
  ORDER.filter(k=>cat=="all"||EN[k].cat==cat).forEach(k=>{const c=cols.reduce((a,b)=>b.h<a.h-.01?b:a);c.html+=card(k);c.h+=(TALL.has(X[k].img)?1.33:.66)+.4});
  $("wall").innerHTML=cols.map(c=>`<div class="col">${c.html}</div>`).join("");
}
let lastN=0;addEventListener("resize",()=>{const n=innerWidth>=1100?4:innerWidth>=700?3:1;if(n!=lastN){lastN=n;render(cur)}});
function sync(){
  document.querySelectorAll(".heart").forEach(h=>h.setAttribute("aria-pressed",picked.has(h.dataset.k)));
  $("tray").classList.toggle("on",picked.size>0);
  $("th").innerHTML=[...picked].slice(-6).map(k=>`<img src="../../img/${X[k].img}" alt="">`).join("");
  $("n").textContent=picked.size+(picked.size==1?" pick":" picks");
  try{localStorage.setItem("picks",JSON.stringify([...picked]))}catch(e){}
}
try{JSON.parse(localStorage.getItem("picks")||"[]").forEach(k=>EN[k]&&picked.add(k))}catch(e){}
const toggle=k=>{picked.has(k)?picked.delete(k):picked.add(k);sync()};
function open(k){const e=EN[k],x=X[k],tour=x.kind=="tour";
  $("sh").dataset.k=k;$("sh").innerHTML=`${car(k)}<div class="in"><h3>${esc(e.t)}</h3><p>${esc(e.d)}</p>
    <dl><dt>Where</dt><dd>${esc(e.area)}</dd><dt>Time</dt><dd>${esc(e.dur)}</dd><dt>Start</dt><dd>${esc(e.start)}</dd><dt>Meet</dt><dd>${esc(e.meet)}</dd>
    ${e.cap?`<dt>Group</dt><dd>${esc(e.cap)}${e.age?" · age "+e.age:""}</dd>`:""}
    <dt>Host</dt><dd>${tour?esc(e.host)+(x.rating?` · ★ ${x.rating} (${x.reviews})`:""):"Route by Yuuki"}</dd></dl>
    <div class="row"><button id="x">Close</button><button class="pri" id="lk">${picked.has(k)?"♥ Liked":"♡ Like this"}</button></div></div>`;
  $("x").onclick=()=>$("dlg").close();$("lk").onclick=()=>{toggle(k);$("dlg").close()};$("dlg").showModal()}
const listText=()=>"My picks:\n"+[...picked].map(k=>`- ${EN[k].t} (${EN[k].area}, ${EN[k].dur})`).join("\n");
$("go").onclick=()=>{$("sh").innerHTML=`<div class="in"><h3>Your picks</h3><ol>${[...picked].map(k=>`<li>${esc(EN[k].t)}</li>`).join("")}</ol>
  <div class="row"><button id="x">Close</button><button class="pri" id="cp">${navigator.share?"Send to Yuuki":"Copy list"}</button></div></div>`;
  $("x").onclick=()=>$("dlg").close();
  $("cp").onclick=async()=>{const t=listText();
    if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name=="AbortError")return}}
    try{await navigator.clipboard.writeText(t);$("cp").textContent="Copied. Paste it in our chat"}catch(e){prompt("Copy this:",t)}};
  $("dlg").showModal()};
$("f").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;$("f").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x==b));render(b.dataset.k);if($("wall").getBoundingClientRect().top<64)$("wall").scrollIntoView()};
$("wall").onclick=ev=>{const h=ev.target.closest(".heart");if(h){toggle(h.dataset.k);return}const c=ev.target.closest(".pc");if(c)open(c.dataset.k)};
$("wall").onkeydown=ev=>{if(ev.key=="Enter"&&ev.target.classList.contains("pc"))open(ev.target.dataset.k)};
$("dlg").onclick=ev=>{if(ev.target==$("dlg"))$("dlg").close()};
$("cr").textContent=CREDIT;lastN=innerWidth>=1100?4:innerWidth>=700?3:1;render("all");sync();
</script>
</body>
</html>
